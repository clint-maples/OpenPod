plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def clintAndroidKeystore = System.getenv("CLINT_ANDROID_KEYSTORE")
def clintAndroidStorePassword = System.getenv("CLINT_ANDROID_STORE_PASSWORD")
def clintAndroidKeyAlias = System.getenv("CLINT_ANDROID_KEY_ALIAS")
def clintAndroidKeyPassword = System.getenv("CLINT_ANDROID_KEY_PASSWORD")
def clintReleaseSigningReady = [clintAndroidKeystore, clintAndroidStorePassword, clintAndroidKeyAlias, clintAndroidKeyPassword].every { it }

def requestedReleaseBuild = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains("release") || n == "assemble" || n.endsWith(":assemble") || n == "build" || n.endsWith(":build")
}
if (requestedReleaseBuild && !clintReleaseSigningReady) {
    throw new GradleException(
        "Release signing requires environment variables: " +
        "CLINT_ANDROID_KEYSTORE, CLINT_ANDROID_STORE_PASSWORD, " +
        "CLINT_ANDROID_KEY_ALIAS, CLINT_ANDROID_KEY_PASSWORD"
    )
}

android {
    namespace 'com.openpod.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.openpod.app"
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName "1.26"
    }

    signingConfigs {
        if (clintReleaseSigningReady) {
            release {
                storeFile file(clintAndroidKeystore)
                storePassword clintAndroidStorePassword
                keyAlias clintAndroidKeyAlias
                keyPassword clintAndroidKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (clintReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += '-opt-in=androidx.media3.common.util.UnstableApi'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
